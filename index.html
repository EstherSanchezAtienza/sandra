        function getScale() {
            const vw = window.innerWidth;
            if (vw < 400) return 0.3; 
            if (vw < 640) return 0.36;
            if (vw < 900) return 0.44; 
            if (vw < 1200) return 0.52;
            return 0.58;
        }
        function buildTitles() {
            const scale = getScale();
            function render(cid, defs) {
                const c = document.getElementById(cid); 
                c.innerHTML = '';
                defs.forEach(item => {
                    if (item.ch === ' ') {
                        const sp = document.createElement('span');
                        sp.className = 'letter-space';
                        c.appendChild(sp);
                        return;
                    }
                    const wrap = document.createElement('span');
                    wrap.className = `letter letter-${item.type}`;
                    wrap.innerHTML = (glyphs[item.ch] || glyphs['A']) (60 * scale);
                    wrap.addEventListener('mouseenter', () => {
                        wrap.style.transition = 'transform .52s cubic-bezier(.34, 1.56, .64, 1)';
                        wrap.style.transform = item.type === 'bw' ? 'rotateY(0deg)' : 'rotateY(180deg)';
                    });
                    wrap.addEventListener('mouseleave', () => {
                        wrap.style.transition = 'transform .52s cubic-bezier(.34, 1.56, .64, 1)';
                        wrap.style.transform = item.type === 'bw' ? 'rotateY(180deg)' : 'rotateY(0deg)';
                    });
                    if (item.link) {
                        wrap.addEventListener('click', () => {
                            document.getElementById(item.link).scrollIntoView({behavior: 'smooth'});
                        });
                    }
                    c.appendChild(wrap);
                });
            }
            render('row1', row1Def);
            render('row2', row2Def);
        }
        window.addEventListener('resize', buildTitles);

        // ── PROGRESSIVE GALLERY REVEAL ───────────────────────────────────────────────
        function revealItems(entries, observer) {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                const el = entry.target;
                const siblings = Array.from(el.parentElement.children);
                const idx = siblings.indexOf(el);
                el.style.animationDelay = (idx * 500) + 'ms';
                el.classList.add('revealed');
                observer.unobserve(el);
            });
        }
        const galleryObserver = new IntersectionObserver(revealItems, {threshold: 0.08, rootMargin: '0px 0px -40px 0px'});
        setTimeout(() => {
            document.querySelectorAll('.palette-swatch').forEach(el => galleryObserver.observe(el));

        const page_size = 4;
        const galleryPage = {rosa: 0, azul: 0, amarillo: 0, bw: 0};

        function countPhotos(gallery) {
            return Object.keys(photos).filter(k => k.includes(gallery)).length;
        }
        function buildGrid(id, total, bwFirst, gallery, page) {
            const c = document.getElementById(id);
            c.innerHTML = '';
            const start = page * page_size;
            const end = Math.min(start + page_size, total);
            for (let i = start; i < end; i++) {
                const localIdv = i - start;
                const d = document.createElement('div');
                const tall = false;//(i === 0 || i === 2 || i === 3 || i === 4 || i === 5 || i === 15 || i === 23);
                d.className = 'photo-placeholder';
                const inner = document.createElement('div');
                inner.className = 'photo-inner' + (tall ? ' tall': '');
                const img = document.createElement('img');
                if (bwFirst && i === 0) {
                    img.src = BW_REAL;
                } else {
                    img.src = photos[gallery+'_'+i] || photos[gallery+'_0'];
                }
                img.alt = 'fotografía';
                img.loading = 'lazy';
                inner.appendChild(img);
                d.appendChild(inner);
                d.addEventListener('click', () => openImg(bwFirst && i === 0 ? BW_REAL : img.src));
                c.appendChild(d);
            }
            document.querySelectorAll('#' + id + ' .photo-placeholder').forEach(el => galleryObserver.observe(el));
            renderPagination(gallery, total, page, bwFirst);
        }
        function renderPagination(gallery, total, page, bwFirst) {
            const pageCount = Math.ceil(total / page_size);
            const pagEl = document.getElementById('pag-' + gallery);
            pagEl.innerHTML = '';
            if (pageCount <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = 'pagination-btn';
            prevBtn.innerHTML = '<span class="pagination-arrow">&#8592;</span>';
            prevBtn.setAttribute('aria-label', 'Grupo anterior');
            prevBtn.disabled = (page === 0);
            prevBtn.addEventListener('click', () => goToPage(gallery, page - 1, total, bwFirst));
            pagEl.appendChild(prevBtn);

            const dots = document.createElement('div');
            dots.className = 'pagination-dots';
            for (let p = 0; p <pageCount; p++) {
                const dot = document.createElement('button');
                dot.className = 'pagination-dot' + (p === page ? ' active' : '');
                dot.setAttribute('aria-label', 'Ir al grupo ' + (p + 1));
                dot.addEventListener('click', () => goToPage(gallery, p, total, bwFirst));
                dots.appendChild(dot);
            }
            pagEl.appendChild(dots);

            const nextBtn = document.createElement('button');
            nextBtn.className = 'pagination-btn';
            nextBtn.innerHTML = '<span class="pagination-arrow">&#8594;</span>';
            nextBtn.setAttribute('aria-label', 'Siguiente grupo');
            nextBtn.disabled = (page >= pageCount - 1);
            nextBtn.addEventListener('click', () => goToPage(gallery, page+1, total, bwFirst));
            pagEl.appendChild(nextBtn);
        }
        function goToPage(gallery, page, total, bwFirst) {
            galleryPage[gallery] = page;
            buildGrid('grid-' + gallery, total, bwFirst, gallery, page);
            document.getElementById('galeria-' + gallery).scrollIntoView({behavior:'smooth', block:'start'});

            clearTimeout(moveTimer);

            if (true) {

        // RAINBOW
        const rainbow = document.getElementById('rainbow');
        const ctx = rainbow.getContext('2d');

        function resizeRainbow() {
            rainbow.width = window.innerWidth;
            rainbow.height = window.innerHeight;
        }
        resizeRainbow();
        window.addEventListener('resize', resizeRainbow);

        let points = [];
        const rainbowColors = ['#E8A4B8', '#FF6B6B', '#FF9F43', '#FECA57', '#5BBFBF', '#54A0FF', '#A29BFE', '#E8C85A', '#00D2D3', '#FF9FF3'];

        function catmullRomSegment(ctx, p0, p1, p2, p3) {
            // Catmull-Rom to bezier conversion
            const cp1x = p1.x + (p2.x - p0.x) /6;
            const cp1y = p1.y + (p2.y - p0.y) /6;
            const cp2x = p2.x - (p3.x - p1.x) /6;
            const cp2y = p2.y - (p3.y - p1.y) /6;
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
        }

        function drawRainbow() {
            ctx.clearRect(0, 0, rainbow.width, rainbow.height);
            if (points.length > 3) {
                const now = Date.now(); const maxAge = 1400;
                points = points.filter(p => now - p.t < maxAge);

                // Draw segments with bezier curves
                for (let i = 1; i < points.length - 2; i++) {
                    const p0 = points[Math.max(0, i-1)];
                    const p1 = points[i];
                    const p2 = points[i+1];
                    const p3 = points[Math.min(points.length-1, i+2)];
                    const age = now - p2.t;
                    const alpha = Math.max(0, 1 - age / maxAge);
                    if (alpha < 0.01) continue;
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    catmullRomSegment(ctx, p0, p1, p2, p3);
                    ctx.strokeStyle = p2.c;
                    ctx.lineWidth = Math.max(0.4, 3 * alpha);
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.globalAlpha = alpha * 0.72;
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }
            requestAnimationFrame(drawRainbow);
        }
        drawRainbow();
